[tool]
id = "com.matthewvlach.music"
label = "Music"
versionCode = 3
versionName = "1.2.0"
# internet is for podcasts: searching, feeds, streaming and downloads.
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"]
# detached-audio keeps music playing after you leave the tool.
# tool-manager-provider lets you add songs and playlists from your computer.
capabilities = ["detached-audio", "tool-manager-provider"]
orientation = "portrait"
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
