name: Build Music

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the tool
        run: |
          set -o pipefail
          ./gradlew -DlightSdk.toolOnly=true :tool:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|not allowed|What went wrong|^> |Exception" build.log | grep -v "^> Task" | head -45 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Name the APK
        run: cp tool/build/outputs/apk/debug/*.apk music.apk

      - uses: actions/upload-artifact@v4
        with:
          name: music-apk
          path: music.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest music.apk --title "Music (latest build)" --notes "Built from ${{ github.sha }}" --prerelease
